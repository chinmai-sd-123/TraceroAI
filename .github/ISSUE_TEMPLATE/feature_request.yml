name: Feature request
description: Suggest an improvement.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind, and any alternatives you considered.
