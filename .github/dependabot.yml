# Weekly update PRs. CI (including the lock check and audits) runs on each.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Updates that change the same files land together instead of conflicting.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /sdks/python
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /traceroai-web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
    ignore:
      # typescript-eslint (used by eslint-config-next) doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /services/api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /traceroai-web
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
