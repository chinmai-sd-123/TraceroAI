name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traceroai
          POSTGRES_PASSWORD: traceroai
          POSTGRES_DB: traceroai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceroai -d traceroai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEROAI_TEST_DATABASE_URL: postgresql+psycopg://traceroai:traceroai@localhost:5432/traceroai_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Render runtime.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      # Install exactly what Render installs, so a missing dependency fails here.
      - run: pip install -r requirements.txt pytest
      - run: python -c "import app.main, app.worker"
      - run: pytest -q

  sdk:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[recovery]" pytest
      - run: pytest -q

  web:
    name: Web typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traceroai-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: traceroai-web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
