name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published vulnerability in a dependency is noticed even
  # when nothing changes here.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traceroai
          POSTGRES_PASSWORD: traceroai
          POSTGRES_DB: traceroai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceroai -d traceroai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEROAI_TEST_DATABASE_URL: postgresql+psycopg://traceroai:traceroai@localhost:5432/traceroai_test
      TRACEROAI_TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Render runtime.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      # The lock (generated from requirements.txt) is what the Docker image installs.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pytest pytest-cov pip-audit
      - run: python -c "import app.main, app.worker, app.keys, app.retention"
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Lock matches requirements.txt
        run: |
          pip install uv
          # Compiling into a copy keeps its pins, so only a change to
          # requirements.txt (not a new upstream release) makes them differ.
          cp requirements.lock /tmp/requirements.lock
          uv pip compile requirements.txt --universal --python-version 3.14 --generate-hashes --quiet -o /tmp/requirements.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)             || { echo "requirements.lock is stale: regenerate it (see CONTRIBUTING.md)"; exit 1; }
      - name: Known vulnerabilities
        run: pip-audit -r requirements.lock --require-hashes

  types:
    name: API type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pyright==1.1.414
      - run: pyright

  sdk:
    name: SDK tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[recovery]" pytest
      - run: pytest -q

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: $COMPOSE up --build -d
      - name: Wait for the API and the dashboard
        run: |
          for url in http://localhost:8000/health http://localhost:3000/; do
            for i in $(seq 90); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
      - name: Send a trace and read it back
        run: |
          query="Compose smoke test: how long does a refund take?"
          trace_id=$(curl -fsS -X POST http://localhost:8000/v1/traces \
            -H 'Content-Type: application/json' \
            -d "{\"query\":{\"original\":\"$query\"},
                 \"retrieval\":{\"chunks\":[{\"rank\":1,\"chunk_id\":\"c1\",\"text\":\"Refunds take 5 to 7 business days.\"}]},
                 \"generation\":{\"model\":\"smoke-test\",\"answer\":\"5 to 7 business days.\"}}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["trace_id"])')
          curl -fsS "http://localhost:8000/v1/traces/$trace_id" \
            | python3 -c 'import json,sys; t=json.load(sys.stdin); assert t["diagnosis"]["label"] != "pending", t["diagnosis"]'
          # The dashboard renders on the server through TRACEROAI_API_URL (http://api:8000).
          curl -fsS http://localhost:3000/dashboard/traces | grep -q "Compose smoke test"
          curl -fsS "http://localhost:3000/dashboard/traces/$trace_id" | grep -q "Compose smoke test"
      - name: Worker processed the queued job
        run: |
          for i in $(seq 30); do
            pending=$(curl -fsS http://localhost:8000/v1/jobs/stats | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s["queued"] + s["pending"])')
            [ "$pending" = "0" ] && exit 0
            sleep 2
          done
          echo "deep-eval queue did not drain"; exit 1
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down -v

  web:
    name: Web typecheck, lint, build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traceroai-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: traceroai-web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Browser smoke test (public pages, dashboard with the API down)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Known vulnerabilities (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high
