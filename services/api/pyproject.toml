[project]
name = "traceroai-api"
version = "0.1.0"
description = "Trace ingestion API for TraceroAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "openai>=1.40.0,<4",
  "redis>=5.0.0",
  "alembic>=1.13",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
# Tests and checks; not needed to run the API.
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]